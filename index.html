<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Digitale opdrachten natuurkunde</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f7fb;
    color: #172033;
}

header {
    background: linear-gradient(135deg, #172554, #2563eb);
    color: white;
    padding: 50px 20px 45px;
}

.wrap {
    max-width: 1050px;
    margin: auto;
}

.label {
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: .8;
}

h1 {
    font-size: clamp(38px, 6vw, 60px);
    margin: 10px 0;
}

header p {
    font-size: 20px;
    margin: 0;
    opacity: .9;
}

main {
    padding: 45px 20px 70px;
}

.section-title {
    font-size: 30px;
    margin: 0 0 25px;
}

.card {
    background: white;
    border: 1px solid #dbe3ec;
    border-radius: 20px;
    padding: 30px;
    margin-bottom: 25px;
    box-shadow: 0 10px 30px rgba(23, 32, 51, .08);
}

.icon {
    font-size: 45px;
    margin-bottom: 10px;
}

h2 {
    font-size: 28px;
    margin: 5px 0 10px;
}

p {
    font-size: 18px;
    line-height: 1.6;
    color: #64748b;
}

footer {
    text-align: center;
    color: #64748b;
    padding: 25px;
    font-size: 14px;
}
</style>
</head>

<body>

<header>
    <div class="wrap">
        <div class="label">Denklassen • Natuurkunde</div>

        <h1>Digitale opdrachten</h1>

        <p>
            Natuurkunde oefenen door eerst na te denken.
        </p>
    </div>
</header>

<main>
    <div class="wrap">

        <h2 class="section-title">
            Kies je klas
        </h2>

        <div class="card">
            <div class="icon">🎓</div>

            <h2>Welkom</h2>

            <p>
                Hier komen straks de digitale opdrachten
                voor de verschillende klassen.
            </p>
        </div>

    </div>
</main>

<footer>
    Digitale opdrachten • Natuurkunde
</footer>

</body>
</html>
