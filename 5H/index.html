<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>5H | Natuurkunde</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f7fb;
    color: #172033;
}

header {
    background: linear-gradient(135deg, #172554, #2563eb);
    color: white;
    padding: 45px 20px;
}

.wrap {
    max-width: 1050px;
    margin: auto;
}

.label {
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: .8;
}

h1 {
    font-size: clamp(40px, 6vw, 58px);
    margin: 10px 0;
}

header p {
    font-size: 20px;
    margin: 0;
    opacity: .9;
}

main {
    padding: 45px 20px 70px;
}

.card {
    background: white;
    border: 1px solid #dbe3ec;
    border-radius: 20px;
    padding: 30px;
    margin-bottom: 25px;
    box-shadow: 0 10px 30px rgba(23, 32, 51, .08);
}

.icon {
    font-size: 45px;
    margin-bottom: 10px;
}

h2 {
    font-size: 30px;
    margin: 5px 0 10px;
}

p {
    font-size: 18px;
    line-height: 1.6;
    color: #64748b;
}

.back {
    display: inline-block;
    margin-top: 5px;
    color: #2563eb;
    text-decoration: none;
    font-weight: bold;
}

.back:hover {
    text-decoration: underline;
}

footer {
    text-align: center;
    color: #64748b;
    padding: 25px;
    font-size: 14px;
}
</style>
</head>

<body>

<header>
    <div class="wrap">

        <div class="label">
            Denklassen • Natuurkunde
        </div>

        <h1>5H</h1>

        <p>
            Denk eerst. Reken daarna.
        </p>

    </div>
</header>

<main>
    <div class="wrap">

        <div class="card">

            <div class="icon">📚</div>

            <h2>Jouw opdrachten</h2>

            <p>
                Hier komen de digitale opdrachten voor 5H.
            </p>

        </div>

        <a class="back" href="../index.html">
            ← Terug naar de klassen
        </a>

    </div>
</main>

<footer>
    5H • Natuurkunde
</footer>

</body>
</html>
